{% extends "base.html" %}
{% block title %}Gallery - valclips{% endblock %}
{% block content %}

<!-- Charts Row -->
<div class="charts-row mb-1">
    <div class="chart-box" style="flex:2;overflow-x:auto">
        <span class="chart-label">Timeline</span>
        <div id="timeline-chart" class="timeline-chart"></div>
    </div>
    <div class="chart-box" style="flex:1">
        <span class="chart-label">Score Spread</span>
        <div id="score-chart" class="score-chart"></div>
    </div>
</div>

<!-- Date Range -->
<div class="date-range-bar">
    <button class="date-btn active" data-range="all">All Time</button>
    <button class="date-btn" data-range="year">Year</button>
    <button class="date-btn" data-range="6mo">6 Mo</button>
    <button class="date-btn" data-range="3mo">3 Mo</button>
    <button class="date-btn" data-range="month">Month</button>
    <button class="date-btn" data-range="week">Week</button>
</div>

<!-- Filter Toolbar -->
<div class="filter-toolbar">
    <input type="search" id="search-input" placeholder="Search clips..." />
    <select id="sort-select">
        <option value="score">Score</option>
        <option value="date">Date</option>
        <option value="kills">Kills</option>
        <option value="duration">Duration</option>
        <option value="size">Size</option>
        <option value="name">Name</option>
    </select>
    <select id="share-select">
        <option value="">All Sources</option>
        {% for name in stats.by_share %}
        <option value="{{ name }}">{{ name }}</option>
        {% endfor %}
    </select>
    <button class="filter-toggle-btn" id="filter-toggle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        Filters
    </button>
</div>

<!-- Advanced Filter Panel -->
<div class="filter-panel" id="filter-panel">
    <div class="filter-panel-grid">
        <div class="filter-group">
            <label>Score</label>
            <select id="score-filter">
                <option value="">Any</option>
                <option value="9">9+ Elite</option>
                <option value="7">7+ Great</option>
                <option value="5">5+ Good</option>
                <option value="3">3+ Okay</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Kills</label>
            <select id="kills-filter">
                <option value="">Any</option>
                <option value="5">5+ Ace</option>
                <option value="4">4+</option>
                <option value="3">3+</option>
                <option value="2">2+</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Type</label>
            <select id="type-filter"><option value="">All</option></select>
        </div>
        <div class="filter-group">
            <label>Agent</label>
            <select id="agent-filter"><option value="">All</option></select>
        </div>
        <div class="filter-group">
            <label>Map</label>
            <select id="map-filter"><option value="">All</option></select>
        </div>
        <div class="filter-group">
            <label>Weapon</label>
            <select id="weapon-filter"><option value="">All</option></select>
        </div>
        <div class="filter-group">
            <label>Clutch</label>
            <select id="clutch-filter"><option value="">All</option></select>
        </div>
    </div>
    <div class="filter-actions">
        <label class="filter-check">
            <input type="checkbox" id="aces-only" />
            Aces only
        </label>
        <label class="filter-check">
            <input type="checkbox" id="hide-dupes" checked />
            Hide duplicates
        </label>
        <button class="btn-ghost btn-sm" id="clear-filters" style="display:none">Clear all</button>
    </div>
</div>

<!-- Active Filter Chips -->
<div id="active-filters" class="active-filters"></div>

<!-- Gallery Header -->
<div class="gallery-header">
    <span id="result-count" class="result-count"></span>
</div>

<!-- Clip Grid -->
<div id="clip-grid" class="clip-grid"></div>
<div id="pagination" class="pagination"></div>

<template id="clip-card-template">
    <article class="clip-card" data-id="">
        <a href="">
            <div class="thumb-wrap">
                <img src="" alt="" loading="lazy" />
                <span class="duration-badge"></span>
                <span class="dupe-badge" style="display:none">DUPE</span>
                <span class="card-score" style="display:none"></span>
            </div>
            <div class="card-body">
                <div class="clip-name"></div>
                <div class="clip-meta"></div>
                <small class="clip-date"></small>
            </div>
        </a>
    </article>
</template>

{% endblock %}
