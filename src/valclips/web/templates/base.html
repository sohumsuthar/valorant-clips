<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}valclips{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-inner">
            <a href="/" class="nav-brand">val<span>clips</span></a>
            <ul class="nav-links">
                <li><a href="/" {% if active_page == 'gallery' %}class="active"{% endif %}>Gallery</a></li>
                <li><a href="/top" {% if active_page == 'top' %}class="active"{% endif %}>Top Clips</a></li>
                <li><a href="/sessions" {% if active_page == 'sessions' %}class="active"{% endif %}>Sessions</a></li>
                <li><a href="/insights" {% if active_page == 'insights' %}class="active"{% endif %}>Insights</a></li>
            </ul>
        </div>
    </nav>
    <main class="container page-content">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/app.js"></script>
</body>
</html>
